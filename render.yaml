services:
  - type: web
    name: tracer-dashboard
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: tracer-comments-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/comments-server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracer-comments-db
          property: connectionString

databases:
  - name: tracer-comments-db
    plan: free
    databaseName: tracer_comments
    user: tracer_comments
