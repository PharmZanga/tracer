services:
  - type: web
    name: tracer-dashboard
    runtime: static
    buildCommand: "true"
    staticPublishPath: public-access-redirect
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: tracer-comments-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/comments-server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracer-comments-db
          property: connectionString
  - type: web
    name: tracer-secure-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/secure-dashboard.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracer-comments-db
          property: connectionString
      - key: COMMENTS_API_URL
        value: https://tracer-comments-api.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: tracer-comments-db
    plan: free
    databaseName: tracer_comments
    user: tracer_comments
